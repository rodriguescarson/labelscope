[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labelscope"
version = "0.1.0"
description = "A diagnostic scope for Vesuvius Challenge surface-label datasets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Carson Rodrigues" }]
keywords = ["vesuvius-challenge", "herculaneum", "segmentation", "data-quality", "nnunet"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "tifffile>=2023.7",
  "imagecodecs>=2023.7",
  "requests>=2.28",
  "pillow>=9.0",
]

[project.optional-dependencies]
zarr = ["numcodecs>=0.12", "zarr>=2.16"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
labelscope = "labelscope.cli:main"

[project.urls]
Homepage = "https://github.com/rodriguescarson/labelscope"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # line length is enforced by the formatter
  "B905",    # zip(strict=) is not available on 3.9
  "UP006",   # typing.Tuple etc. are still needed on 3.9
  "UP035",
  "UP007",   # X | Y annotations: the package supports 3.9
  "UP045",   # Optional[X] likewise
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
