<!doctype html><meta charset='utf-8'>
<title>labelscope — alignment</title>
<style>
:root{--bg:#fbfaf8;--fg:#20201d;--mut:#5d5b55;--line:#ddd9d2;--warn:#8a3a12;--ok:#1f5c34}
*{box-sizing:border-box}
body{margin:0;padding:2.5rem 1.5rem;background:var(--bg);color:var(--fg);
     font:16px/1.6 ui-serif,Georgia,'Times New Roman',serif;max-width:64rem;margin-inline:auto}
h1{font-size:1.9rem;margin:0 0 .3rem}
h2{font-size:1.25rem;margin:2.4rem 0 .8rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}
p.sub{color:var(--mut);margin:0 0 2rem}
table{border-collapse:collapse;width:100%;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.9rem;margin:1rem 0}
.card{border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;background:#fff}
.card .v{font:600 1.5rem/1.2 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.card .k{color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.warn{color:var(--warn)} .ok{color:var(--ok)}
.scroll{overflow-x:auto}
footer{margin-top:3rem;color:var(--mut);font-size:.85rem}
</style>
<h1>labelscope — alignment</h1>
<p class='sub'>No usable pairs.</p>
<div class="cards"></div>
<footer>Generated by <a href='https://github.com/rodriguescarson/labelscope'>labelscope</a> — MIT licensed.</footer>
